name: RepoGuard causal requirements gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Temporary diagnostic — print RepoGuard compiler report without modifying verdict
        if: always()
        run: |
          set +e
          p=$(find /home/runner/work/_actions -path '*/dist/repo-guard.mjs' -print -quit)
          echo "RepoGuard compiler: $p"
          if [ -n "$p" ]; then
            node "$p" --repo-root "$GITHUB_WORKSPACE" check --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --format json
          fi
