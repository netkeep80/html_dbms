name: Subject tests and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded PR commits cannot become the accepted HEAD. Keep main runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/core.test.cjs
      - run: node tests/stability.test.cjs
      - run: node tests/metrics.test.cjs
      - run: node tests/differential.test.cjs
      - run: node tests/boundaries.test.cjs
      - run: node --expose-gc tests/benchmark.cjs
      - run: python3 build.py && git diff --exit-code -- dist/html_dbms.html dist/html_dbms.xml
      - run: node tests/app.test.cjs
      - run: node tests/docs-language.test.cjs
      - run: python3 tests/dual_build.py
      - run: node examples/cash/build-demo.cjs
      - run: node tests/cash-money.test.cjs
      - run: python3 tests/cash-oracle.py
      - run: node tests/cash_crud.test.cjs
      - run: node tests/pages-data.test.cjs
      - run: python3 tests/compare_excel.py tests/fixtures/cash_input.xlsx dist/html_dbms_cash_demo.html
      - name: External V8 coverage of core functions and branches
        run: |
          NODE_V8_COVERAGE="$RUNNER_TEMP/hdbms-core-coverage" node --test --experimental-test-coverage --test-coverage-include=src/core.js tests/core.test.cjs tests/stability.test.cjs tests/boundaries.test.cjs tests/differential.test.cjs tests/metrics.test.cjs tests/cash_crud.test.cjs tests/pages-data.test.cjs
          python3 tests/coverage_report.py "$RUNNER_TEMP/hdbms-core-coverage"

  cash-browser-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Chromium (native probe, conditional OS dependencies)
        run: bash tools/ci-browser.sh
      - name: Build production containers and synthetic cash
        run: python3 build.py && node examples/cash/build-demo.cjs
      - name: Cash RPC integration
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_cash_acceptance.py
      - name: Native UI smoke
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_smoke.py
      - name: Dual HTML/XML UI integration
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_dual.py
      - name: HEAD and URL integration
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_head_url.py
      - name: Native file Web Crypto
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_native_crypto.py
      - name: Native shell stability
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_stability.py
      - name: Native RPC document sessions
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_rpc_session.py
      - name: Native HEAD and URL
        if: ${{ !cancelled() }}
        run: HDBMS_REAL_CRYPTO=1 .venv/bin/python tests/browser_head_url.py
      - name: Native HTTPS synthetic cash
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_pages.py
      - name: External V8 coverage of exact browser scripts (separate diagnostic run)
        if: ${{ !cancelled() }}
        run: .venv/bin/python tests/browser_coverage.py
