name: Subject tests and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/core.test.cjs
      - run: node tests/stability.test.cjs
      - run: node tests/metrics.test.cjs
      - run: node tests/differential.test.cjs
      - run: node tests/boundaries.test.cjs
      - run: node --expose-gc tests/benchmark.cjs
      - run: python3 build.py && git diff --exit-code -- dist/html_dbms.html dist/html_dbms.xml
      - run: node tests/app.test.cjs
      - run: node tests/docs-language.test.cjs
      - run: python3 tests/dual_build.py
      - run: node examples/cash/build-demo.cjs
      - run: node tests/cash_crud.test.cjs
      - run: node tests/pages-data.test.cjs
      - run: python3 tests/compare_excel.py tests/fixtures/cash_input.xlsx dist/html_dbms_cash_demo.html
      - name: External V8 coverage of core functions and branches
        run: node --test --experimental-test-coverage --test-coverage-include=src/core.js tests/core.test.cjs tests/stability.test.cjs tests/boundaries.test.cjs tests/differential.test.cjs tests/metrics.test.cjs tests/cash_crud.test.cjs tests/pages-data.test.cjs

  cash-browser-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for full entry-shell RPC acceptance test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Build and test cash application with sandboxed iframe
        run: |
          python3 build.py
          node examples/cash/build-demo.cjs
          .venv/bin/python tests/browser_cash_acceptance.py
          .venv/bin/python tests/browser_smoke.py
          .venv/bin/python tests/browser_dual.py
          .venv/bin/python tests/browser_head_url.py
          .venv/bin/python tests/browser_native_crypto.py
          .venv/bin/python tests/browser_stability.py
          .venv/bin/python tests/browser_rpc_session.py
          HDBMS_REAL_CRYPTO=1 .venv/bin/python tests/browser_head_url.py
          .venv/bin/python tests/browser_pages.py
