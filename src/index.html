<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML DBMS 3</title>
<style>
:root{font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#eaf0f8;background:#0c1520;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit;color:inherit;background:#172739;border:1px solid #3b526c;border-radius:5px}button{cursor:pointer;padding:5px 9px;white-space:nowrap}button:hover{background:#24435e}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #86c3f5;outline-offset:1px}button:disabled{cursor:not-allowed;opacity:.55}input,select{min-height:29px;padding:4px 7px}input{min-width:0}.brand{font-size:16px;font-weight:750;white-space:nowrap}.version{color:#98b4d0;font-size:12px;white-space:nowrap}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#142338;border-bottom:1px solid #40516a;min-height:43px;overflow-x:auto;white-space:nowrap}.toolbar .divider{height:20px;width:1px;background:#43556b;flex:none}.toolbar .stretch{flex:1}.toolbar select{max-width:180px;min-width:130px}.toolbar label{font-size:11px;color:#a9bfd6;display:flex;align-items:center;gap:5px}.toolbar input{font:11px/1.4 ui-monospace,Consolas,monospace}#head-id{width:185px}#head-hash{width:325px}.primary{border-color:#208d74;background:#126756}.secondary{border-color:#476684}.app-main{min-height:calc(100vh - 44px);max-width:1450px;margin:auto;padding:12px}.notice{font-size:12px;color:#9db5ca;min-height:19px;margin:0 0 8px}.notice.error{color:#ffacac}.notice.good{color:#9edec4}.entry-area{min-height:56vh}.placeholder{background:#132236;border:1px dashed #3a526a;border-radius:9px;padding:24px;color:#9fb7ce;text-align:center}.pane{background:#142338;border:1px solid #34506a;border-radius:8px;padding:14px;margin:10px 0}.entry-area pre,.debug pre{background:#07111c;color:#c4e1e8;padding:12px;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace}.entry-area iframe{border:0;display:block;width:100%;min-height:72vh;background:#0d1724;border-radius:7px}.debug{border-color:#907550}.diagnostic{white-space:pre-wrap;overflow:auto;max-height:55vh;padding:12px;background:#07111c;color:#c4e1e8;border-radius:6px;font:12px/1.45 ui-monospace,Consolas,monospace}.pane h2{font-size:15px;margin:0 0 9px}.pane p{margin:8px 0}.pane .row{margin:8px 0}.pane label{font-size:12px;color:#adc4d9}.pane label input{font:12px ui-monospace,Consolas,monospace;width:290px;max-width:85vw}.danger{background:#703039;border-color:#a65964}details#recovery-section{border-top:1px solid #43556b;margin-top:14px;padding-top:12px}details#recovery-section summary{cursor:pointer}.debug h2{font-size:15px;margin:0 0 7px}.entry-launch{display:inline-flex;gap:8px;align-items:center;margin:9px 0}.meta{color:#a1bacd;font-size:12px}.toolbar-menu{position:relative;flex:none}.toolbar-menu summary{border:1px solid #3b526c;padding:5px 9px;border-radius:5px;cursor:pointer;list-style:none}.toolbar-menu summary::-webkit-details-marker{display:none}.toolbar-menu .menu{position:fixed;right:8px;top:44px;background:#142338;border:1px solid #3b526c;border-radius:6px;box-shadow:0 7px 24px #050c16b3;padding:8px;display:flex;flex-direction:column;gap:5px;z-index:12}.toolbar-menu button{text-align:left}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}@media(max-width:800px){.toolbar{padding:6px}.app-main{padding:8px}#head-id{width:150px}#head-hash{width:210px}}
</style></head>
<body>
<header class="toolbar" aria-label="Базовые операции HTML DBMS">
  <strong class="brand">HTML DBMS</strong><span class="version">3.0</span>
  <span class="divider"></span>
  <button id="new-db" class="primary">Новая</button>
  <select id="databases" aria-label="Выбрать опубликованную БД"><option value="">— существующая —</option></select>
  <label for="head-id">ID</label><input id="head-id" placeholder="22 символа" autocomplete="off" spellcheck="false" aria-label="Физический идентификатор версии">
  <label for="head-hash">H</label><input id="head-hash" placeholder="43 символа" autocomplete="off" spellcheck="false" aria-label="Хеш версии">
  <button id="open-head" class="primary">Открыть</button>
  <button id="save" class="primary">Сохранить</button>
  <button id="debug-toggle" aria-controls="debug-panel" aria-expanded="false">Отладка</button>
  <div class="toolbar-menu"><details id="more-menu"><summary title="Дополнительные базовые операции">⋯</summary><div class="menu">
    <button id="import">Загрузить HTML</button><button id="copy-head">Копировать ID + H</button>
    <button id="verify">Проверить цепочки</button><button id="publish">Публиковать</button><button id="hide-head">Скрыть публикацию</button>
  </div></details></div>
  <input id="input-html" type="file" accept=".html,text/html" hidden>
</header>
<main class="app-main">
  <div id="status" class="notice" role="status" aria-live="polite"></div>
  <section id="entry-area" class="entry-area" aria-label="Приложение из JSON entry">
    <div class="placeholder">Выберите опубликованную БД или введите ID и H, затем нажмите «Открыть».</div>
  </section>
  <section id="debug-panel" class="pane debug" hidden><h2>Отладка · расшифрованная цепочка (read-only)</h2><pre id="debug-raw"></pre></section>
</main>
<script id="db-store" type="application/json">{"format":"HTML_DBMS/3","publicHeads":{},"records":{}}</script>
<script id="starter-source" type="text/plain">/* STARTER_JS */</script>
<script>/* CORE_JS */</script>
<script>/* APP_JS */</script>
</body></html>
