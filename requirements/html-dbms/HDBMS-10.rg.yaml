format: repo-guard/requirement-v1
id: HDBMS-10
normative: |
  ### HDBMS-10 — Демо-касса: первичные JSON-цепочки, ID-ссылки и вычисляемые представления
  **Обязательно:** демонстрационный автономный HTML содержит ровно одну опубликованную БД «Касса», 11 независимых криптографических цепочек (журнал непустых транзакций и 10 справочников исходного Excel). Исходная обезличенная XLSX хранится как fixture с фиксированной SHA-256. Импорт игнорирует пустые Excel-строки транзакций, сохраняет координаты и исходную provenance; текстовые ссылки канонизируются без учёта регистра. Каждая строка хранит ID из справочников: toTypeId, toId, typeId, fromTypeId, fromId. UI отображает подписи, предоставляет только связанные выпадающие списки для выбора этих ID и отклоняет несопоставленные ссылки. Шесть аналитических листов воспроизводятся вычисляемыми JavaScript views, а не сохраняются как JSON-документы; для сравнения с исходной книгой сохранено её историческое исключение 32-й категории из итогов пяти SUMIFS-отчётов. Строгие тесты по расшифрованной криптографической версии сверяют 1641 операций, первичные справочники, шесть отчётов и XLSX-контрольный хеш. Демо показывает полный журнал без пагинации; поле «План/Факт» удалено из runtime JSON и UI (три исторических флага План сохраняются только в XLSX fixture; соответствующие операции и типы не удаляются). Каждый из шести view включает горизонтальную гистограмму остатков, аналогичную Excel-диаграмме листа «Участники(Фонд)». Справочники имеют действия создания отдельного JSON-документа, добавления и изменения записей через JSON Patch при неизменных ID; пользовательские имена документов подключаются через корневой $refs. Приложение использует всю доступную ширину и высоту окна браузера ниже системной панели. Browser smoke проверяет интерфейс отдельно от криптографии; Node Web Crypto тест дополнительно проверяет CRUD и исторические snapshots. Никаких кассовых правил в src/core.js или в обязательной системной панели.
