format: repo-guard/requirement-v1
id: HDBMS-10
normative: |
  ### HDBMS-10 — Демо-касса: первичные JSON-цепочки, ID-ссылки и вычисляемые представления
  **Обязательно:** демонстрационный автономный HTML содержит ровно одну опубликованную БД «Касса», 11 независимых криптографических цепочек (журнал непустых транзакций и 10 справочников исходного Excel). Исходная обезличенная XLSX хранится как fixture с фиксированной SHA-256. Импорт игнорирует пустые Excel-строки транзакций, сохраняет provenance транзакций и исходную XLSX-fixture; номера строк Excel не хранятся в JSON-справочниках и не показываются в их таблицах; текстовые ссылки канонизируются без учёта регистра. Каждая строка хранит ID из справочников: toTypeId, toId, typeId, fromTypeId, fromId. UI отображает подписи, предоставляет только связанные выпадающие списки для выбора этих ID и отклоняет несопоставленные ссылки. Шесть аналитических листов воспроизводятся вычисляемыми JavaScript views, а не сохраняются как JSON-документы; исторический дефект исключения 32-й категории устранён в новой модели; все категории включаются в итог, сравнение кэша Excel диагностическое. Строгие тесты по расшифрованной криптографической версии сверяют 1641 операций, первичные справочники, шесть отчётов и XLSX-контрольный хеш. Демо показывает полный журнал без пагинации; поле «План/Факт» удалено из runtime JSON и UI (3 исторических флага План сохранены в XLSX fixture, соответствующие категории транзакций остаются). Каждый из шести view включает горизонтальную гистограмму остатков, аналогичную Excel диаграмме листа «Участники(Фонд)». Справочники имеют действия создания отдельного JSON-документа, добавления записи и изменения записи через JSON Patch, при неизменных ID; действия работают при sandbox iframe без allow-forms (через обработчики click, не submit), записывают реальные цепочки после разрешения пользователя, отображают ошибку в форме, поддерживают отмену без изменения root и экспорт/повторное открытие; собственные имена справочников подключаются через root $refs. Приложение разворачивается на доступную область окна браузера под системной панелью. Browser smoke проверяет интерфейс отдельно от проверок криптографии; интеграционный Node Web Crypto тест проверяет CRUD и восстановление истории. Никаких кассовых правил в src/core.js или в обязательной системной панели.
  В версии 4 все 32 типа транзакций и 1641 комментарий заменены синтетическими; справочные описания и повторно использованные тексты также обезличены. XLSX и демо согласованы по новым значениям и контрольной сумме; числовые расчёты сохранены. Старые данные в истории Git не удаляются этой заменой.
  #45: новые snapshots кассы содержат только amountMinor (safe integer копеек); ввод из десятичной строки, знак и ноль сохраняются, отрицательный ноль канонизируется; все денежные агрегаты BigInt, форматирование точное; все записи проверяются до формирования отчётов. Старый ciphertext не изменяется. Не публиковать новые Excel-derived артефакты до #50.
