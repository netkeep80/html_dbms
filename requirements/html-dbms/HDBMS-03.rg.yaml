format: repo-guard/requirement-v1
id: HDBMS-03
normative: |
  ### HDBMS-03 — Воспроизводимая сборка и честная граница безопасности
  **Обязательно:** репозиторий содержит детерминированно собранный автономный HTML и тестируемые исходники без пользовательских секретов. CI выполняет Node-тесты ядра и UI и сравнивает dist с воспроизводимой сборкой. Браузерный smoke отделяет проверку UI-связей от криптографических проверок: его тестовый shim не является реальной криптографией. GitHub Action RepoGuard закреплён за точным SHA и проверяет BASE/HEAD. Ключ AES=SHA256(plaintext) не гарантирует конфиденциальность предсказуемого содержимого; CI не является криптографической сертификацией.
