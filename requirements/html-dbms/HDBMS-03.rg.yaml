    target: {kind: artifact, path: 'build.py'}
  - predicates: [implemented_by]
    target: {kind: artifact, path: '.github/workflows/quality.yml'}
  - predicates: [implemented_by]
    target: {kind: artifact, path: '.github/workflows/repo-guard.yml'}
  - predicates: [documents]
    target: {kind: artifact, path: 'docs/SRS.md'}
  - predicates: [documents]
    target: {kind: artifact, path: 'README.md'}
