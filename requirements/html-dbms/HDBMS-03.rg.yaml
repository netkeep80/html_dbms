format: repo-guard/requirement-v1
id: HDBMS-03
normative: |
  ### HDBMS-03 — Reproducible build and honest security boundary

  **MUST:** The repository ships only synthetic examples, testable source and a deterministically built single-file artifact. CI executes subject tests and checks generated artifact freshness. RepoGuard Action is pinned to an immutable upstream SHA and receives exact PR BASE/HEAD. CI status alone does not establish subject-matter correctness or required branch protection.
relations:
