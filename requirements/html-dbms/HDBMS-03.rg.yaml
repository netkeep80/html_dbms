format: repo-guard/requirement-v1
id: HDBMS-03
normative: |
  ### HDBMS-03 — Воспроизводимая автономная сборка и граница безопасности
  
  Обязательно: единственный автономный HTML с embedded core, starter и shell собирается детерминированно из src/index.html, src/core.js, src/starter.js и src/app.js. Сборка проверяется CI, экспорт выполняется из чистого шаблона, не включая расшифрованное DOM-состояние. Экспериментальная message-locked схема не заявляет конфиденциальность предсказуемых данных; необходим независимый аудит.
relations:
