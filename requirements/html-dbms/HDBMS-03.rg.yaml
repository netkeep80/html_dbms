format: repo-guard/requirement-v1
id: HDBMS-03
normative: |
  ### HDBMS-03 — Воспроизводимая сборка и достоверно описанная граница безопасности

  **Обязательно:** репозиторий содержит только синтетические примеры, тестируемые исходники и детерминированно собранный однофайловый артефакт. CI выполняет предметные тесты и проверяет актуальность сгенерированного HTML. GitHub Action RepoGuard закреплён за неизменяемым SHA исходного коммита и получает точные SHA состояний BASE/HEAD запроса на слияние. Успешный CI сам по себе не доказывает предметную корректность или наличие обязательной защиты ветки.
