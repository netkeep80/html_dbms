format: repo-guard/requirement-v1
id: HDBMS-14
normative: |
  ### HDBMS-14 — Стабилизация, этап 1 (#41)
  Genesis использует одни сериализованные байты и один SHA-256 plaintext. Формат /4 не меняется. Структурная проверка всех ciphertext: алфавит, канонические остаточные биты, минимальный GCM tag и лимит. readRecord использует прямой lookup без перебора. Обычная запись корня и дочерних документов проверяется до commit, включая исторический rollback; отказ не изменяет рабочую копию. Повторное чтение корневой цепочки при открытии не требуется. Сохранены независимый verifier, явная перезапись и отсутствие legacy.
  Этап 2: внешний store принимается через adoptStore; контролируемые словари поддерживают структурные инварианты, overlay хранит только дельту физических слотов, commit проверяет базовую ревизию, конкурентные физические операции отклоняют устаревшую запись. Replay root совмещён со сбором исторических refs. Ошибка entry не отзывает криптографически проверенный root. Внутреннее проверенное состояние хранит последние HEAD всех исторических alias, в том числе удалённых; обычный свободный append использует проверенное состояние, изменения refs проверяют наследование последнего HEAD, overwrite запускает полную независимую проверку. Любая физическая мутация инвалидирует proof; новый проверенный proof устанавливается при commit. Внешние readState не возвращают изменяемые ссылки на proof. Контекст оболочки включает epoch, store, revision, URL, HEAD и ввод; устаревший RPC, диагностика и импорт не публикуют результат. Импорт HTML через inert template в отдельном HTML-документе; XML без DTD/ENTITY и внешних processing instructions. Startup listener снимается при отзыве iframe. Входные JSON Patch и initial state фиксируются до await, внешние read operations принимают единый управляемый snapshot, JSON array accessors отклоняются. Полная приёмка этапа отдельно.
  Этап 3: RPC использует выделенный MessagePort документа; window message только одноразовый handshake, отзыв при pagehide/load и смене entry. Блокировки привязаны к epoch. Размер records поддерживается инкрементально; импорт ограничен 256 МиБ и 10000 template, обход template итеративный.
  Браузерное ядро не содержит Node Buffer/require/CommonJS; внешний src/core-node.cjs подключает то же ядро для инструментов. Сборщик кассы добавляет только data script с доверенным исходником и CSS, не переписывает JS оболочки. Неиспользуемые CSS старого меню и таблиц starter удалены.
  Этап 3b: непрозрачный store handle, физические records/catalog полностью приватны; управляемая мутация через явные методы ядра, без Proxy. Snapshot создаётся только для экспорта и явной диагностики; каталог — копия строковых HEAD. Commit передаёт приватный каталог stage без повторной копии. Неизменяемая ревизия и proof сохранены.
  Production compilation: фиксированные версии esbuild и html-minifier-terser, один ESM core для Node и браузера, явный браузерный API, tree-shaking, minify+mangle JS/CSS/markup и sandbox bootstrap. HTML/XML получают одинаковый скомпилированный код; Node-only функции и комментарии не поставляются. Сборщик кассы не модифицирует JS; доверенный исходник хранится JSON-строкой.
