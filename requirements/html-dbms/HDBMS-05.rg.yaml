format: repo-guard/requirement-v1
id: HDBMS-05
normative: |
  ### HDBMS-05 — Русский язык сопровождаемой документации
  **Обязательно:** вся изменяемая текстовая документация, спецификации, инструкции и нормативные формулировки требований написаны на русском языке. Технические идентификаторы, JSON-поля, имена стандартов, исходный код, команды, пути и текст LICENSE сохраняют оригинальное написание. Проверки CI и требования к редакторской точности остаются обязательными.
