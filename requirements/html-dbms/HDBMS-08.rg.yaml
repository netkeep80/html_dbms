format: repo-guard/requirement-v1
id: HDBMS-08
normative: |
  ### HDBMS-08 — JSON-only domain, семантика replay и явное восстановление
  
  Обязательно: допустимы только значения JSON-domain (null, boolean, конечные числа, строки, плотные массивы, plain objects), без accessor/не-JSON типов. Patch-массив непустой; обычное сообщение [ISO_UTC_time,prevID,prevH,operations], без seq. Genesis и каждый Patch проверяются при replay. Диагностика не удаляет данные; физически повреждённая ancestry и явно запрошенное восстановление различаются.
relations:
  - predicates: [implemented_by]
    target: {kind: artifact, path: 'src/core.js'}
  - predicates: [implemented_by]
    target: {kind: artifact, path: 'src/app.js'}
  - predicates: [verified_by]
    target: {kind: artifact, path: 'tests/core.test.cjs'}
  - predicates: [documents]
    target: {kind: artifact, path: 'docs/SRS-3.md'}
