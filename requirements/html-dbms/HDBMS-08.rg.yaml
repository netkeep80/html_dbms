format: repo-guard/requirement-v1
id: HDBMS-08
normative: |
  ### HDBMS-08 — Произвольный JSON, ссылки, воспроизведение и безопасное восстановление
  **Обязательно:** в криптоядре нет обязательных политик main/transaction или схем таблиц. Строгий JSON-domain исключает undefined, NaN/Infinity, BigInt, функции, Symbol, циклы, sparse arrays, экзотические объекты. Патчи корректно применяются повторно к универсальному JSON. Поле $refs выбранного root содержит alias → HEAD, адрес {$ref:"/pointer"} локален, {$ref:"alias/pointer"} разрешается относительно выбранной root-версии. Разрешение диагностирует циклы и отсутствующие ссылки. Верификация отдельно проверяет историю корня и объявленных дочерних версий. Чтение не изменяет ciphertext; truncateInvalidTail требует свежий диагноз и непосредственно предшествующий проверенный recovery head, сохраняет изменённый occupied slot, удаляет только подтверждённых потомков после явного подтверждения.
