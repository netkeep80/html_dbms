format: repo-guard/requirement-v1
id: HDBMS-06
normative: |
  ### HDBMS-06 — Детерминированный genesis и отсутствие легаси
  
  Обязательно: genesis содержит [null,{name,parent,state}]; для дочерних документов parent=[ID,H] выбранного root до регистрации в $refs, для самостоятельных корней parent=null. Genesis детерминирован по сериализованному содержимому. Контейнеры и записи 2.x не открываются и не мигрируются внутри v3; fallback отсутствует.
