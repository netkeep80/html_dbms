format: repo-guard/requirement-v1
id: HDBMS-06
normative: |
  ### HDBMS-06 — Детерминированный genesis и отсутствие легаси до стабильного релиза

  **Обязательно:** содержимое genesis является семантической идентичностью логической цепочки. Genesis не получает автоматически время, случайный physical ID или иные скрытые различающие данные. Одинаковый genesis распознаётся как существующая цепочка. Создатель может включить nonce в сам genesis для независимой или непредсказуемой идентичности. Значение records[ID] является непосредственно Base64url ciphertext. До первого стабильного релиза код поддерживает только текущий формат HTML_DBMS/2.2; 2.1, 2.0 и другие экспериментальные форматы отвергаются без миграции и fallback-чтения.
