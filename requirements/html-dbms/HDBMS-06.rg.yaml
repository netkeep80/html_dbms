format: repo-guard/requirement-v1
id: HDBMS-06
normative: |
  ### HDBMS-06 — Детерминированный genesis, выводимый IV и отсутствие легаси до стабильного релиза

  **Обязательно:** содержимое genesis является семантической идентичностью логической цепочки. Genesis не получает автоматически время, случайный физический ID или иные скрытые различающие данные. Одинаковый genesis в одном физическом хранилище должен распознаваться как уже существующая цепочка и не создавать новую запись. Создатель может сознательно добавить случайный nonce внутрь genesis для независимой или непредсказуемой идентичности. AES-GCM IV не хранится и равен первым 12 байтам 16-байтового физического ID; `records[ID]` является непосредственно Base64url ciphertext. До первого стабильного релиза поддержка старых экспериментальных форматов, миграция и смешанное чтение запрещены: контейнер с иным `format` должен завершаться отказом.
