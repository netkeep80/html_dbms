format: repo-guard/requirement-v1
id: HDBMS-07
normative: |
  ### HDBMS-07 — Необязательный publicHeads и занятый successor
  
  Обязательно: physical store HTML_DBMS/3 содержит records и необязательный publicHeads {имя:[ID,H]}. Один HTML допускает несколько независимых БД, скрытые БД открываются напрямую по head. Каталог объявляет точки входа, но не служит доказательством их актуальности. Занятый successor запрещает штатный append без мутации, явная перезапись не удаляет потомков автоматически.
