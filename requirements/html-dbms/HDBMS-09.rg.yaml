format: repo-guard/requirement-v1
id: HDBMS-09
normative: |
  ### HDBMS-09 — Безопасный импорт, размеры и изолированное entry
  
  Обязательно: внешний HTML разбирается инертным DOMParser, принимается ровно один script#db-store[type=application/json], чужой JS не выполняется как следствие импорта. Base64url каноничен, timestamp проверяется как ISO UTC, чтение лимитирует количество и размер записей. JSON из entry не исполняется без доверенного host разрешения; исполняемый модуль запускается в sandbox iframe с ограничивающим CSP. Полноценная защита от побочных каналов не утверждается.
