format: repo-guard/requirement-v1
id: HDBMS-02
normative: |
  ### HDBMS-02 — Строгая граница минимальной оболочки и приложения JSON entry
  **Обязательно:** один автономный HTML имеет узкую верхнюю строку: HTML DBMS, версия, Новая, список БД, HEAD, Открыть, Сохранить, Инфо, Валидация, Отладка. Выбор в списке лишь заполняет HEAD; кнопка Открыть всегда читает поле и не зависит от списка. Инфо раскрывает операции контейнера; Валидация — проверки цепочек, исторического HEAD, внешнего HTML и консервативного восстановления; Отладка показывает сырые расшифрованные сообщения read-only. Служебные панели скрыты по умолчанию. Все прикладные интерфейсы/таблицы/редакторы определяются полем entry корневого JSON, а не жёсткой схемой DBMS. JS-программы запускаются в sandbox с ограниченным RPC и подтверждением записи; произвольный код не исполняется автоматически. Экспорт использует чистый шаблон, не сериализует plaintext из DOM и не публикует скрытые heads.
  При запуске строгий fragment #head=HEAD имеет приоритет; ошибка не допускает fallback и старый iframe. При отсутствии fragment автоматически открывается ровно одна опубликованная БД; при нескольких требуется выбор, при нуле — нейтральный экран.
