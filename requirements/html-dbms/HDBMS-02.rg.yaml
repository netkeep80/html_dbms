format: repo-guard/requirement-v1
id: HDBMS-02
normative: |
  ### HDBMS-02 — Универсальные JSON-документы и интерфейс через entry
  
  Обязательно: любое допустимое JSON-состояние хранится как независимая цепочка; встроенных политик main/transaction нет. Поддерживаются RFC 6901 JSON Pointer, RFC 6902 JSON Patch, корневое пространство имён $refs и междокументные $ref. Системная строка содержит только операции контейнера и явные поля ID/H; выбор опубликованной БД только подставляет их, а кнопка Открыть всегда читает их значения. Всё прикладное содержимое ниже строится из entry. JavaScript entry исполняется изолированно, не автоматически для произвольного кода, а запись через host API подтверждается.
