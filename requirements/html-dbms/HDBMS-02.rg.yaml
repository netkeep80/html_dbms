format: repo-guard/requirement-v1
id: HDBMS-02
normative: |
  ### HDBMS-02 — Portable generic UI and nested transaction log

  **MUST:** The browser UI edits synthetic generic tables, records changes as RFC 6902 patches addressed by RFC 6901 pointers, and stores an independent append-only transaction chain whose head is referenced from the main state. Export creates a complete portable HTML copy; executable source from stored JSON is not evaluated.
