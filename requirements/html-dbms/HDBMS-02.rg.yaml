format: repo-guard/requirement-v1
id: HDBMS-02
normative: |
  ### HDBMS-02 — Переносимый интерфейс и вложенная транзакционная цепочка

  **Обязательно:** браузерный интерфейс редактирует синтетические таблицы через RFC 6902/RFC 6901 и ведёт независимую транзакционную цепочку. Schema, заголовки и типы транзакционных полей принадлежат genesis транзакционной цепочки и не определяются main-цепочкой. Main хранит operational head вложенной цепочки. При replay проверяется монотонность фактических вложенных head после каждого main event, независимо от синтаксиса Patch. Экспорт создаёт автономную HTML-копию из чистого начального шаблона, не сериализует живой DOM с plaintext/ID/H/отладочными данными, не публикует скрытый head и не запускает исполняемый код из данных. Интерфейс предоставляет явный read-only отладочный режим: для уже открытых цепочек он показывает physical ID, H и исходные расшифрованные массивы событий; скрытые цепочки без известного head не сканируются и не подбираются.
