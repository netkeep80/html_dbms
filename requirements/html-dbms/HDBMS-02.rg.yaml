format: repo-guard/requirement-v1
id: HDBMS-02
normative: |
  ### HDBMS-02 — Переносимый универсальный интерфейс и вложенный журнал транзакций

  **Обязательно:** браузерный интерфейс позволяет редактировать синтетические универсальные таблицы, записывать изменения как патчи RFC 6902 с адресацией RFC 6901 и вести независимую транзакционную цепочку только с добавлением, последний хэш которой указан в основном состоянии. Экспорт формирует полную переносимую HTML-копию; исполняемый код, хранящийся в JSON, не запускается.
