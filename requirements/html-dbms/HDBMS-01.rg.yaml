format: repo-guard/requirement-v1
id: HDBMS-01
normative: |
  ### HDBMS-01 — Детерминированные и проверяемые зашифрованные цепочки только с добавлением

  **Обязательно:** движок вычисляет детерминированный адрес следующей записи из хэша предыдущей с разделением доменов SHA-256; запрещает перезапись и конкурирующие продолжения в одном общем хранилище; при чтении проверяет AES-GCM и хэш открытой записи; восстанавливает логическую историю по точным ссылкам на предшественников. Для подтверждения происхождения необходима независимая доверенная контрольная точка. Это экспериментальный механизм целостности, а не гарантия конфиденциальности или глобального консенсуса.
