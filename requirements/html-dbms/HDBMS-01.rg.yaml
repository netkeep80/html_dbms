format: repo-guard/requirement-v1
id: HDBMS-01
normative: |
  ### HDBMS-01 — Проверяемые криптоцепочки JSON-документов
  
  Обязательно: SHA-256 сериализованной UTF-8 JSON-записи вычисляет H, который используется как AES-256-GCM key. Genesis адресуется first16(SHA256(H)), successor — first16(SHA256(raw(prevID)||raw(prevH))), IV=first12(raw(ID)). При воспроизведении проверяются AES-GCM, H, physical ID, predecessor ID/H, корректность JSON Patch и ancestry. Порядковый номер вычисляется по позиции в проверенной цепочке и не хранится. Перезапись промежуточного physical slot диагностируется без молчаливого изменения истории.
