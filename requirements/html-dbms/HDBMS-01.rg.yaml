format: repo-guard/requirement-v1
id: HDBMS-01
normative: |
  ### HDBMS-01 — Детерминированные проверяемые криптоцепочки

  **Обязательно:** plaintext записи хэшируется SHA-256, полученный 256-битный H используется также как ключ AES-GCM. Genesis адресуется первыми 128 битами SHA-256 от H. Successor адресуется первыми 128 битами SHA-256 от конкатенации 16-байтового ID и 32-байтового H предшественника. IV равен первым 12 байтам physical ID. При чтении проверяются AES-GCM, SHA-256 plaintext, physical address, sequence и predecessor ID/H. Разрыв ancestry должен обнаруживаться явно; старый поздний head после замены промежуточного slot не должен молча переходить на новую историю.
