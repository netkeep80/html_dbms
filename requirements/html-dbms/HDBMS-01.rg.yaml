format: repo-guard/requirement-v1
id: HDBMS-01
normative: |
  ### HDBMS-01 — Детерминированные и проверяемые append-only цепочки

  **Обязательно:** полный plaintext каждой записи хэшируется SHA-256, полученный 256-битный хэш является также ключом AES-GCM. Genesis адресуется первыми 128 битами SHA-256 от собственного 256-битного хэша. Каждая следующая запись адресуется первыми 128 битами SHA-256 от конкатенации 16-байтового физического ID и 32-байтового хэша предшественника. Существующий физический адрес никогда не перезаписывается. При чтении проверяются AES-GCM, хэш plaintext, последовательность, predecessor ID/hash и вычисленный адрес. Для подтверждения происхождения необходим независимый доверенный anchor.
