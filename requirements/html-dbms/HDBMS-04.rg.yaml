format: repo-guard/requirement-v1
id: HDBMS-04
normative: |
  ### HDBMS-04 — Явное и согласованное лицензирование

  **Обязательно:** публичный распространяемый прототип явно указывает принятую лицензию; оригинальный текст LICENSE и публичная документация не должны противоречить друг другу. Изменение лицензионных условий подлежит отдельному рассмотрению. Наличие лицензии не означает криптографическую сертификацию или пригодность для финансовой эксплуатации.
relations:
  - predicates: [documents]
    target: {kind: artifact, path: 'LICENSE'}
  - predicates: [documents]
    target: {kind: artifact, path: 'README.md'}
