format: repo-guard/requirement-v1
id: HDBMS-04
normative: |
  ### HDBMS-04 — Явное лицензирование
  
  Обязательно: публичный распространяемый прототип явно указывает принятую лицензию, включающую согласованный текст LICENSE, без противоречивых описаний в README.
relations:
  - predicates: [documents]
    target: {kind: artifact, path: 'LICENSE'}
  - predicates: [documents]
    target: {kind: artifact, path: 'README.md'}
